name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend/web
      - run: pnpm test && pnpm build
        working-directory: frontend/web
  kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/kiosk/package-lock.json
      - run: npm ci
        working-directory: frontend/kiosk
      - run: npm run build
        working-directory: frontend/kiosk
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew compileJava compileTestJava test --tests '*ChatbotServiceTest' --tests '*ChatbotControllerTest' --no-daemon
        working-directory: backend
