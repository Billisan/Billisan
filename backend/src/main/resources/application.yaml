spring:
  application:
    name: billisan

  # GMS 게이트웨이가 응답 없이 멈추는 경우를 대비한 상한 — 없으면 서버 스레드가 무한
  # 대기하고, RN 클라이언트의 fetch()도 기본 타임아웃이 없어 같이 무한 대기할 수 있다
  # (chatbot-service 프로토타입에서 2026-08-03 FE 통합 재검증 중 발견해 추가한 설정).
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billisan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  admin:
    idle-expiration-seconds: ${JWT_ADMIN_IDLE_EXPIRATION_SECONDS:1800}
    absolute-expiration-seconds: ${JWT_ADMIN_ABSOLUTE_EXPIRATION_SECONDS:28800}

# 관리자 웹 CORS 허용 origin(콤마 구분). 실제 배포 시 Vercel 도메인 추가 필요.
admin:
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:billisan-server}

# 챗봇 LLM 게이트웨이 — 2026-08-03: Spring AI(spring.ai.openai.*)를 걷어내고 RestClient로
# 직접 호출하면서 이 프로젝트 자체 설정 블록으로 옮겼다. GMS_KEY 환경변수명은 그대로 유지
# (배포 배선이 이미 이 이름으로 GitLab CI/CD 변수·docker-compose.yml에 연결돼 있음).
gms:
  api-key: ${GMS_KEY:}
  base-url: http://localhost:9999/v1
  model: gpt-5.4-nano
  temperature: 0.2

chatbot:
  knowledge-location: "classpath:knowledge/*.md"
  # CHATBOT_MESSAGE_TOO_LONG 임계값 — 팀 확정 수치 아님, MVP 기본값(CLAUDE.md "미확정
  # 사항" 원칙에 따라 코드에 하드코딩하지 않고 여기서 관리).
  max-message-length: ${CHATBOT_MAX_MESSAGE_LENGTH:500}

logging:
  pattern:
    # RequestIdLoggingFilter가 MDC에 심어둔 X-Request-Id를 로그 레벨 옆에 노출한다.
    level: "%5p [%X{requestId}]"
