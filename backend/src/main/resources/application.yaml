spring:
  application:
    name: billisan

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billisan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  admin:
    idle-expiration-seconds: ${JWT_ADMIN_IDLE_EXPIRATION_SECONDS:1800}
    absolute-expiration-seconds: ${JWT_ADMIN_ABSOLUTE_EXPIRATION_SECONDS:28800}

# 관리자 웹 CORS 허용 origin(콤마 구분). 실제 배포 시 Vercel 도메인 추가 필요.
admin:
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:billisan-server}

logging:
  pattern:
    # RequestIdLoggingFilter가 MDC에 심어둔 X-Request-Id를 로그 레벨 옆에 노출한다.
    level: "%5p [%X{requestId}]"
