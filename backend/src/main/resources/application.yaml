spring:
  application:
    name: billisan
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billisan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  admin:
    idle-expiration-seconds: ${JWT_ADMIN_IDLE_EXPIRATION_SECONDS:1800}
    absolute-expiration-seconds: ${JWT_ADMIN_ABSOLUTE_EXPIRATION_SECONDS:28800}
admin:
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:5173}
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:billisan-server}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
# Keep the existing Java configuration namespace for the optional LLM client.
gms:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:http://localhost:9999/v1}
  model: ${LLM_MODEL:}
  temperature: 0.2
  max-tokens: 2000

# WEATHER-001 — 기상청 API 허브 초단기예보(getUltraSrtFcst). 위경도 대신 역삼역 인근 격자좌표로 고정한다.
weather:
  kma:
    api-key: ${KMA_API_KEY:}
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
    nx: 61
    ny: 125

chatbot:
  knowledge-location: "classpath:knowledge/*.md"
  max-message-length: ${CHATBOT_MAX_MESSAGE_LENGTH:500}
logging:
  pattern:
    level: "%5p [%X{requestId}]"
