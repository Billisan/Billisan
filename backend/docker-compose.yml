services:
  app:
    image: billisan-app:latest
    container_name: billisan-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      db:
        condition: service_healthy
    networks:
      - billisan-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: billisan-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - billisan-net

  db:
    image: mysql:8.0
    container_name: billisan-db
    restart: unless-stopped
    # Flyway V14가 만드는 트리거 생성에 필요(ci.yml의 테스트 MySQL 컨테이너와 동일 옵션).
    # 이게 없으면 binlog가 켜진 상태에서 트리거 생성이 거부되어 V14에서 마이그레이션이 실패한다.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billisan-net

networks:
  billisan-net:

volumes:
  db-data: