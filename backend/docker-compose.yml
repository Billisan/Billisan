services:
  app:
    image: billisan-app:latest
    container_name: billisan-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-billisan_p0_p1}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-billisan}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - billisan-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: billisan-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - billisan-net

  db:
    image: mysql:8.0
    container_name: billisan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billisan_p0_p1}
      MYSQL_USER: ${MYSQL_USERNAME:-billisan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billisan-net

networks:
  billisan-net:

volumes:
  db-data:
